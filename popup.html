<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Focus Companion</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: Arial, sans-serif; margin:10px; min-width:320px; }
    #tabList { margin-top:12px; max-height:300px; overflow:auto; }
  </style>
</head>
<body class="light">
  <h2>Focus Companion</h2>

  <button id="toggle-focus">Activate Focus Mode</button>
  <label style="margin-left:10px;">Threshold (min)</label>
  <input id="threshold" type="number" min="1" value="2" style="width:60px;margin-left:6px;"/>

  <div style="margin-top:8px;">
    <button id="categorize-tabs">Refresh Tabs</button>
    <button id="reset-settings">Reset</button>
    <button id="toggle-theme">Toggle Theme</button>
  </div>

  <div id="tabList" class="tabs-container"></div>

  <script src="popup.js"></script>
</body>
</html>
